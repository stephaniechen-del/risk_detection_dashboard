services:
  - type: web
    name: risk-player-dashboard
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /app/data
    disk:
      name: dashboard-data
      mountPath: /app/data
      sizeGB: 1
